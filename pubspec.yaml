name: dailydesk
description: 离线优先全能生产力中枢
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  ulid: ^2.0.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  http: ^1.2.1
  network_info_plus: ^5.0.3
  nsd: ^4.0.4
  crypto: ^3.0.3
  window_manager: ^0.3.9
  system_tray: ^0.1.1
  hotkey_manager: ^0.2.3
  screen_retriever: ^0.1.9
  shared_preferences: ^2.5.3
  launch_at_startup: ^0.3.1
  flutter_slidable: ^3.1.0
  flutter_displaymode: ^0.6.0
  wakelock_plus: ^1.2.8
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  audioplayers: ^6.0.0
  pretty_qr_code: ^3.3.0
  flutter_markdown: ^0.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.ico
