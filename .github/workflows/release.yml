name: DailyDesk release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows portable archive
        shell: pwsh
        run: |
          $source = "build/windows/x64/runner/Release"
          $archive = "artifacts/DailyDesk-${{ github.ref_name }}-win-x64.zip"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "$source/*" -DestinationPath $archive -Force

      - name: Build Android split APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify bundles
        run: >
          dart run scripts/verify_bundle.dart
          --apk build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          --apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          --apk build/app/outputs/flutter-apk/app-x86_64-release.apk
          --windows-zip artifacts/DailyDesk-${{ github.ref_name }}-win-x64.zip
          --tag ${{ github.ref_name }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DailyDesk-${{ github.ref_name }}
          path: |
            artifacts/*.zip
            build/app/outputs/flutter-apk/*-release.apk

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DailyDesk-${{ github.ref_name }}
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
